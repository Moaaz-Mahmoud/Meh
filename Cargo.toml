[package]
name = "meh"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A minimal espanso-style text expander for Windows"
license = "MIT"
repository = "https://github.com/Moaaz-Mahmoud/meh"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_norway = "0.9.42"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
notify = "8.2.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_System_Com",
] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(meh_typecheck)'] }

[profile.release]
lto = true
codegen-units = 1
strip = true
