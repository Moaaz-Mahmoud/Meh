# Builds meh on Windows. Runs only when asked (D-03, D-06):
# - push a tag `vX.Y.Z`: test, build, package and publish a GitHub release;
# - "Run workflow" (workflow_dispatch): the same build as a dry run, with the
#   files attached to the run as an artifact and no release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # First, so a tag that does not match Cargo.toml fails before the
      # test and build steps spend any time.
      - name: Version
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $line) { throw "No version found in Cargo.toml" }
          $version = $line.Matches[0].Groups[1].Value
          Write-Host "Cargo.toml version: $version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and "v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version v$version"
          }
          "MEH_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc -V
          cargo -V

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Installer
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          & $iscc "/DMyAppVersion=$env:MEH_VERSION" installer\meh.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable zip
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'meh-zip'
          New-Item -ItemType Directory -Force -Path $stage, dist | Out-Null
          Copy-Item target\release\meh.exe, README.md, LICENSE -Destination $stage
          Copy-Item assets\base.sample.yml -Destination (Join-Path $stage 'base.sample.yml')
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "dist\meh-$env:MEH_VERSION-windows-x64.zip" -Force
          Get-ChildItem dist

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meh-dist
          path: dist/*
          if-no-files-found: warn

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME @files --title "meh $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
